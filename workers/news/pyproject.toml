[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-market-intelligence-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
sentiment = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors>=0.4",
]
test = [
    "pytest>=8.0",
]

# Render deployment metadata — do not edit unless you know what you're doing.
# See docs/deploy/render.md for the full deployment guide.
[tool.render]
environment-vars = {}
build-context = "./config,./models"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
